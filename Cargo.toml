[package]
name = "maho"
version = "0.1.0"
edition = "2024"
description = "Cast your everyday commands as spells: a magic circle unfolds in your terminal before each one runs"
license = "MIT"
repository = "https://github.com/yukihirop/maho"
readme = "README.md"
keywords = ["cli", "terminal", "magic-circle", "kitty", "iterm2"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.23.1"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
resvg = { version = "0.48.1", default-features = false }
sha2 = "0.11.0"
